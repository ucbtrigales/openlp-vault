[project]
name = "openlp_vault"
version = "0.1.0"
description = "Sincronización de respaldos de OpenLP usando Google Drive"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=0.4.0",
    "click>=8.0"
]

[project.scripts]
openlp-vault = "openlp_vault.cli:cli"
openlp-vault-gui = "openlp_vault.gui:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["openlp_vault"]
include-package-data = true
